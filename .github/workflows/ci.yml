name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails if the committed generated TypeScript (src/generated/level5-v2.ts) doesn't match
      # the pinned contract snapshot (contracts/level5-v2.openapi.json) - i.e. the snapshot was
      # updated without regenerating types, or the generated file was hand-edited. Never reaches
      # out to Backend V2 or GitHub - both inputs are committed. See contracts/README.md.
      - run: npm run contracts:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Only meaningful after the real production build above - see
      # proxy.static-routes.build.test.ts's own comment. Fails the build if
      # STATIC_PUBLIC_ROUTES (src/proxy.ts) ever drifts from what Next actually rendered
      # statically, the class of bug this same PR sequence already hit twice.
      - run: npx vitest run src/proxy.static-routes.build.test.ts

  redis-integration:
    runs-on: ubuntu-latest
    # Exact pinned patch tag - never `latest` or a floating minor - and Redis >=6.2 for SET's
    # combined NX+PXAT option (see RedisWebSessionStore.create). Kept as a separate job so the
    # `build` job above never depends on a Redis service and stays fast/dependency-free.
    services:
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs the whole suite again with real-Redis-gated tests enabled - non-Redis tests are
      # unaffected by the extra env var, so this doesn't duplicate maintenance of a separate test
      # file list. See package.json's test:redis script and
      # src/lib/web-auth/*.redis.test.ts's header comments.
      - run: npm run test:redis
        env:
          LEVEL5_WEB_SESSION_REDIS_URL: redis://localhost:6379

  e2e-production:
    runs-on: ubuntu-latest
    # A full real-Backend-V2 pass (issue #10): checks out sweat-this/Level5Backend alongside this
    # repo, brings up a real Postgres + Redis, runs Backend V2's own EF Core migrations, starts it
    # for real, then runs both the dev-mode (e2e/) and production-mode (e2e-production/) Playwright
    # suites against it. Informational for now (continue-on-error below) - not yet a required
    # merge gate, since it's the newest and most cross-repo-dependent job here (see "Do not make
    # optional/manual diagnostics required merge gates until they are deterministic").
    #
    # History: this job used to fail 100% of the time at "Apply Backend V2 EF Core migrations"
    # (a global `dotnet-ef` install never satisfies Backend V2's own pinned local tool manifest;
    # fixed by "Restore Backend V2 tools" below), and then on the four production visual-regression
    # tests, which had only Windows baselines committed (Linux baselines now live in
    # e2e-production/visual-regression.spec.ts-snapshots/). Promote this job to required once it
    # has passed on 5 consecutive dev-branch runs. Note that `continue-on-error` makes the
    # *workflow* report success even when this job fails - judge this job by its own conclusion
    # (`gh run view <id> --json jobs`), not the overall run status.
    continue-on-error: true
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: level5
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: level5_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout Backend V2 (dev)
        uses: actions/checkout@v4
        with:
          repository: sweat-this/Level5Backend
          ref: dev
          path: backend

      # Backend `dev` is a moving ref, so record exactly which commits this run certifies. Both
      # SHAs are also written to the job summary; the Backend line is the resolved commit, not
      # the branch name.
      - name: Record tested revisions
        env:
          # On pull_request runs the checkout is GitHub's synthetic merge commit, which only
          # exists for this run - so also record the PR head commit that a person can check out.
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          frontend_sha=$(git -C frontend rev-parse HEAD)
          backend_sha=$(git -C backend rev-parse HEAD)
          echo "Frontend source commit: $SOURCE_SHA"
          echo "Frontend tested checkout: $frontend_sha"
          echo "Backend V2 (sweat-this/Level5Backend dev): $backend_sha"
          {
            echo "### Production E2E - tested revisions"
            echo ""
            echo "| Repository | Commit |"
            echo "| --- | --- |"
            echo "| sweat-this/level5frontend (source) | \`$SOURCE_SHA\` |"
            echo "| sweat-this/level5frontend (checked out) | \`$frontend_sha\` |"
            echo "| sweat-this/Level5Backend (dev) | \`$backend_sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Backend V2 pins its own dotnet-ef in .config/dotnet-tools.json (exact version, no roll
      # forward). Restoring that manifest is the only source of `dotnet ef` here - a global
      # install can't satisfy it, and a second version pin in this repo would drift from it.
      - name: Restore Backend V2 tools
        working-directory: backend
        run: dotnet tool restore

      - name: Restore Backend V2 NuGet packages
        working-directory: backend
        run: dotnet restore v2/Level5BackendV2.sln

      - name: Apply Backend V2 EF Core migrations
        working-directory: backend
        run: >-
          dotnet ef database update
          --project v2/src/Level5.Infrastructure
          --startup-project v2/src/Level5.Api
        env:
          ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=level5_v2;Username=level5;Password=ci-password"

      - name: Generate a CI-only JWT signing key
        id: jwt
        # Same shape as scripts/generate-jwt-key.ps1 (64 random bytes, base64) - generated fresh
        # every run, never persisted past the job, never a real secret.
        run: echo "key=$(openssl rand -base64 64)" >> "$GITHUB_OUTPUT"

      # Built separately (and started with --no-build below) so the readiness wait that follows
      # measures the service starting, not `dotnet run` compiling it.
      - name: Build Backend V2
        working-directory: backend
        run: dotnet build v2/src/Level5.Api --no-restore

      - name: Start Backend V2
        working-directory: backend
        run: |
          nohup dotnet run --no-build --project v2/src/Level5.Api --urls http://localhost:5250 > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/backend.pid"
        env:
          ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=level5_v2;Username=level5;Password=ci-password"
          Jwt__Key: ${{ steps.jwt.outputs.key }}
          ASPNETCORE_ENVIRONMENT: Development

      # /health/ready (Program.cs) runs Backend V2's own "ready"-tagged health checks - i.e. it
      # only returns 200 once the app can actually reach Postgres - so an HTTP response of any
      # other kind (a 404, a 500, a 503 while a dependency is down) is not treated as ready. Also
      # stops early if the process has already exited, rather than polling a dead port.
      - name: Wait for Backend V2 to be ready
        run: |
          for i in $(seq 1 45); do
            if ! kill -0 "$(cat "$GITHUB_WORKSPACE/backend.pid")" 2>/dev/null; then
              echo "Backend V2 process exited before becoming ready - backend.log:"
              cat "$GITHUB_WORKSPACE/backend.log" || true
              exit 1
            fi
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5250/health/ready) || code=000
            if [ "$code" = "200" ]; then
              echo "Backend V2 ready (/health/ready 200) after $i attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Backend V2 /health/ready never returned 200 (last status: $code) - backend.log:"
          cat "$GITHUB_WORKSPACE/backend.log" || true
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        id: playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Dev-mode e2e suite
        working-directory: frontend
        # Playwright wipes its output dir at the start of every run, and both configs default to
        # test-results/ - a separate dir keeps this suite's failure traces alive for the upload
        # step below even though the production suite runs after it.
        run: npm run test:e2e -- --output=test-results-dev
        env:
          CI: "true"
          LEVEL5_E2E_BACKEND_BASE_URL: http://localhost:5250

      # Runs even if the dev-mode suite failed (as long as setup got this far), so one run reports
      # the real result of both suites; the job still fails if either does.
      - name: Production-mode e2e suite
        if: ${{ !cancelled() && steps.playwright.conclusion == 'success' }}
        working-directory: frontend
        run: npm run test:e2e:production
        env:
          CI: "true"
          LEVEL5_E2E_BACKEND_BASE_URL: http://localhost:5250

      - name: Upload Backend V2 log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-v2-log
          path: backend.log
          if-no-files-found: ignore

      # Playwright traces, and for a failed toHaveScreenshot() the actual/expected/diff images.
      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            frontend/test-results
            frontend/test-results-dev
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      # PR-diff-based - flags newly-introduced high/critical-severity advisories without needing
      # a live backend, so it stays fast and independent of e2e-production above. See
      # docs/operations/frontend-production.md for the dependency-security response process this
      # backs (an unfixed upstream advisory in an existing dependency is a judgment call, not an
      # automatic merge block - only a *newly added* high/critical is).
      # Required (not continue-on-error): the "Dependency graph is enabled" rejection this step
      # used to hit was a stale-snapshot issue, not a real configuration gap (confirmed via the
      # GitHub API that this repo's dependency graph is populated and Advanced Security is on for
      # this public repo) - and it's passed on every real PR run checked (3/3) since. Revert to
      # continue-on-error if it starts failing for a reason unrelated to an actual new advisory.
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Informational only (continue-on-error): a known/unfixed upstream advisory with no
      # available patch must never permanently redden this pipeline - see the response process
      # doc referenced above for how those get triaged instead of silently ignored.
      - name: npm audit (informational)
        continue-on-error: true
        run: npm audit --audit-level=high
