name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails if the committed generated TypeScript (src/generated/level5-v2.ts) doesn't match
      # the pinned contract snapshot (contracts/level5-v2.openapi.json) - i.e. the snapshot was
      # updated without regenerating types, or the generated file was hand-edited. Never reaches
      # out to Backend V2 or GitHub - both inputs are committed. See contracts/README.md.
      - run: npm run contracts:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
